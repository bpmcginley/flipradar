name: scan-and-publish

# Rebuilds the DB from scratch each run (data/ is gitignored), then publishes
# the static dashboard to docs/ for GitHub Pages. Each pipeline step uses
# continue-on-error so one blocked source never kills the publish.

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan sources
        continue-on-error: true
        run: python cli.py scan

      - name: Enrich top listings
        continue-on-error: true
        run: python cli.py enrich --limit 30

      - name: Export static site
        continue-on-error: true
        run: python export_static.py

      - name: Commit docs/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "docs/ unchanged; nothing to commit"
          else
            git commit -m "chore: refresh static dashboard [skip ci]"
            git push
          fi
